


[actions.clear]
emoji = "🧹"
text  = "Clear"
type  = "text"
payload = "/clear"

[actions.compact]
emoji = "📦"
text  = "Pack"
type  = "text"
payload = "/compact"

[actions.deepthink]
emoji = "🧠"
text  = "Deep"
type  = "key"
payload = "Tab"
read_state = true

[actions.mode]
emoji = "🆕"
text  = "Mode"
type  = "key"
payload = '\x1b[Z'
literal = true
read_state = true



[providers.claude]
style = "emoji_text"
buttons = [
  ["screen",   "ctrlc",   "live"     ],
  ["mode",     "think",   "deepthink"],
  ["up",       "enter",   "down"     ],
  ["clear",    "compact", "esc"      ],
  ["last",     "getfile", "close"    ],
]

[providers.codex]
style = "emoji_text"
buttons = [
  ["screen",  "ctrlc",   "live" ],
  ["esc",     "tab",     "mode" ],
  ["up",      "enter",   "down" ],
  ["last",    "getfile", "clear", "close"],
]

[providers.pi]
style = "emoji_text"
buttons = [
  ["screen",  "ctrlc",   "live"  ],
  ["esc",     "tab",     "model" ],
  ["up",      "enter",   "down"  ],
  ["last",    "getfile", "close" ],
]

[providers.shell]
style = "text"
buttons = [
  ["screen",  "ctrlc",   "live"  ],
  ["enter",   "eof",     "susp"  ],
  ["last",    "getfile", "clear", "close"],
]
