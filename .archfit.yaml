version: 1
languages:
  python:
    package: ccgram
  go:
    enabled: false
  typescript:
    enabled: false
coupling:
  min_severity: medium
  volatility_cascade: true
exclude:
  - '**/fonts/**'
  - '**/miniapp/static/**'
  - '**/pkg/mod/**'  
analyzers:
  scip:
    enabled: true
  syntax:
    enabled: true
  clones:
    enabled: true  
ai:
  provider: anthropic
  model: claude-opus-4-8
layers:
  - core
  - adapter
modules:
  handlers:
    paths:
      - ccgram.handlers
      - ccgram.handlers.*
    layer: adapter
    owner: alexei-led
    subdomain: core  
    volatility: high
  providers:
    paths:
      - ccgram.providers
      - ccgram.providers.*
    layer: adapter
    owner: alexei-led
    subdomain: supporting  
    volatility: medium
  hooks:
    paths:
      - ccgram.hooks
      - ccgram.hooks.*
    layer: core
    owner: alexei-led
    subdomain: supporting
    volatility: low
  llm:
    paths:
      - ccgram.llm
      - ccgram.llm.*
    layer: core
    owner: alexei-led
    subdomain: generic  
    volatility: low
  miniapp:
    paths:
      - ccgram.miniapp
      - ccgram.miniapp.*
    layer: core
    owner: alexei-led
    subdomain: supporting
    volatility: medium
  tts:
    paths:
      - ccgram.tts
      - ccgram.tts.*
    layer: core
    owner: alexei-led
    subdomain: generic
    volatility: low
  whisper:
    paths:
      - ccgram.whisper
      - ccgram.whisper.*
    layer: core
    owner: alexei-led
    subdomain: generic
    volatility: low
  window_state_ports:
    paths:
      - ccgram.window_state_ports
      - ccgram.window_state_ports.*
    layer: core
    owner: alexei-led
    subdomain: core
    volatility: medium
  session_state_ports:
    paths:
      - ccgram.session_state_ports
      - ccgram.session_state_ports.*
    layer: core
    owner: alexei-led
    subdomain: core
    volatility: medium
  session_state:
    paths:
      - ccgram.session
      - ccgram.session_map
      - ccgram.session_lifecycle
      - ccgram.session_resolver
      - ccgram.session_query
      - ccgram.session_monitor
      - ccgram.topic_state_registry
      - ccgram.claude_task_state
      - ccgram.idle_tracker
      - ccgram.state_persistence
      - ccgram.monitor_events
      - ccgram.monitor_state
      - ccgram.event_stream_monitor  
    layer: core
    owner: alexei-led
    subdomain: core
    volatility: high
  window_state:
    paths:
      - ccgram.window_query
      - ccgram.window_resolver
      - ccgram.window_state_store
      - ccgram.window_view
    layer: core
    owner: alexei-led
    subdomain: core
    volatility: medium
  transcript:
    paths:
      - ccgram.transcript_parser
      - ccgram.transcript_reader
      - ccgram.event_reader
      - ccgram.terminal_parser
      - ccgram.screen_buffer
      - ccgram.last_unit
    layer: core
    owner: alexei-led
    subdomain: supporting  
    volatility: medium
  domain_config:
    paths:
      - ccgram
      - ccgram._version
      - ccgram.config
      - ccgram.user_preferences
      - ccgram.toolbar_config
      - ccgram.command_catalog
      - ccgram.utils
      - ccgram.expandable_quote
      - ccgram.tool_format
    layer: core
    owner: alexei-led
    subdomain: generic  
    volatility: low
  telegram_adapter:
    paths:
      - ccgram.telegram_client
      - ccgram.telegram_draft
      - ccgram.telegram_request
      - ccgram.telegram_sender
      - ccgram.bot
      - ccgram.cc_commands
      - ccgram.entity_formatting
    layer: adapter
    owner: alexei-led
    subdomain: supporting
    volatility: medium
  multiplexer:
    paths:
      - ccgram.multiplexer  
      - ccgram.multiplexer.base  
      - ccgram.multiplexer.vim_state
      - ccgram.multiplexer.window_ops
      - ccgram.multiplexer.self_identify
      - ccgram.multiplexer.agent_status_cache  
      - ccgram.multiplexer.topic_mapping  
    layer: core
    owner: alexei-led
    subdomain: generic
    volatility: low  
  multiplexer_backends:
    paths:
      - ccgram.multiplexer.tmux
      - ccgram.multiplexer.herdr
      - ccgram.multiplexer.herdr_events  
      - ccgram.multiplexer.registry
    layer: adapter
    owner: alexei-led
    subdomain: generic
    volatility: medium  
  provider_detection:
    paths:
      - ccgram.providers.process_detection
    layer: adapter
    owner: alexei-led
    subdomain: generic
    volatility: low
  terminal_adapter:
    paths:
      - ccgram.thread_router
      - ccgram.screenshot
    layer: adapter
    owner: alexei-led
    subdomain: supporting
    volatility: low
  app_bootstrap:
    paths:
      - ccgram.main
      - ccgram.cli
      - ccgram.bootstrap
      - ccgram.doctor_cmd
      - ccgram.status_cmd
      - ccgram.hook
    layer: adapter
    owner: alexei-led
    subdomain: generic  
    volatility: low
rules:
  - id: no-handlers-to-tmux
    type: forbidden_dependency
    from: ccgram.handlers**
    to: ccgram.multiplexer.tmux
    gate: fail
  - id: no-handlers-to-herdr
    type: forbidden_dependency
    from: ccgram.handlers**
    to: ccgram.multiplexer.herdr
    gate: fail
  - id: no-handlers-to-mux-registry
    type: forbidden_dependency
    from: ccgram.handlers**
    to: ccgram.multiplexer.registry
    gate: fail
  - id: no-providers-to-tmux
    type: forbidden_dependency
    from: ccgram.providers**
    to: ccgram.multiplexer.tmux
    gate: fail
  - id: no-providers-to-herdr
    type: forbidden_dependency
    from: ccgram.providers**
    to: ccgram.multiplexer.herdr
    gate: fail
  - id: no-handlers-to-provider-detection
    type: forbidden_dependency
    from: ccgram.handlers**
    to: ccgram.providers.process_detection
    gate: fail
  - id: no-import-cycles
    type: cycle
    gate: warn
